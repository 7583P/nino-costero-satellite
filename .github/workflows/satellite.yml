name: Satélite NOAA GOES-19 Cada 10 Min (S/ 0)

on:
  # Programador nativo de GitHub desactivado para evitar ejecuciones duplicadas;
  # El despachador primario 24/7 es Cloudflare Workers Cron Trigger (nino-costero-scheduler)
  # schedule:
  #   - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      cold:
        description: 'Ignore cached regional extracts (cold start)'
        type: boolean
        default: false
      publish:
        description: 'Publish validated assets to Cloudflare Worker'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: satellite-sync
  cancel-in-progress: false

jobs:
  satellite-10m:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install binary wheels
        run: |
          pip install --only-binary=:all: -r requirements.txt

      - name: Scientific verification
        run: |
          python -m unittest discover -s tests -p "test_sat_*.py" -v

      - name: Restore regional state
        id: state
        if: github.event_name == 'schedule' || inputs.cold != true
        uses: actions/cache/restore@v4
        with:
          path: .sat_state
          key: sat-state-10m-${{ github.run_id }}
          restore-keys: sat-state-10m-

      - name: Ingest and process NOAA GOES-19 scans
        run: |
          python -I sat/pipeline.py \
            --state .sat_state \
            --out build/sat \
            --glm-hours 1.25 \
            --max-glm 260 \
            --cadence "cadencia operativa GOES-19 cada 10 min; arquitectura publica 24/7 S/ 0"

      - name: Validate data contract and asset integrity
        run: |
          python -m sat.validate --out build/sat --state .sat_state --report build/validation.json

      - name: Publish validated products
        if: github.event_name == 'schedule' || inputs.publish != false
        env:
          SAT_PUBLISH_TOKEN: ${{ secrets.SAT_PUBLISH_TOKEN || secrets.PUBLISH_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          python -I sat/publish.py --out build/sat --state .sat_state --send

      - name: Save regional state
        if: always() && hashFiles('.sat_state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .sat_state
          key: sat-state-10m-${{ github.run_id }}

      - name: Prune older state caches (keep latest 2 to prevent 10 GB limit exhaustion)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --repo ${{ github.repository }} --key sat-state-10m- --json id,createdAt --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].id' | while read id; do
            if [ -n "$id" ]; then
              echo "Pruning older cache ID $id..."
              gh cache delete "$id" --repo ${{ github.repository }} || true
            fi
          done

      - name: Evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-measurement
          path: |
            build/sat/manifest.json
            build/validation.json
          retention-days: 1

      - name: Execution telemetry summary
        if: always()
        run: |
          python -c "import json; m=json.load(open('build/sat/manifest.json')); print(json.dumps({'generated_at': m['generated_at'], 'run': m.get('run', {}), 'latest_err': m.get('err', {}).get('latest'), 'cloud_slot': m.get('cloud', {}).get('slot')}, indent=2))" || true

      - name: Auto-dispatch DWD ICON-EPS when live forecast run is older than 14.5h
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          python -c "
          import json, os, subprocess, urllib.request
          from datetime import datetime, timezone
          base = (os.getenv('WORKER_URL') or 'https://nino-costero-api.matiasxdfuaqpro910.workers.dev').rstrip('/')
          for suffix in ('/admin/sat/manifest', '/admin/hourly', '/admin/snapshot'):
              if base.endswith(suffix):
                  base = base[:-len(suffix)]
          try:
              req = urllib.request.Request(f'{base}/v2/hourly/piura.json', headers={'User-Agent': 'NinoCostero-Scheduler/2.5'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  doc = json.loads(r.read().decode('utf-8'))
              run_utc = datetime.fromisoformat(doc['run']['run_utc'].replace('Z', '+00:00'))
              age_h = (datetime.now(timezone.utc) - run_utc).total_seconds() / 3600.0
              print(f'Live DWD ICON-EPS run={doc[\"run\"][\"run_id\"]} age={age_h:.2f}h')
              if age_h >= 14.8:
                  out = subprocess.check_output(['gh', 'run', 'list', '--workflow', 'dwd_icon_eps.yml', '--limit', '1', '--json', 'status,createdAt'], text=True)
                  runs = json.loads(out)
                  can_dispatch = True
                  if runs:
                      st = runs[0].get('status')
                      created = datetime.fromisoformat(runs[0]['createdAt'].replace('Z', '+00:00'))
                      if st in ('in_progress', 'queued', 'waiting') or (datetime.now(timezone.utc) - created).total_seconds() < 3600:
                          can_dispatch = False
                  if can_dispatch:
                      print('Dispatching dwd_icon_eps.yml workflow...')
                      subprocess.run(['gh', 'workflow', 'run', 'dwd_icon_eps.yml'], check=False)
          except Exception as e:
              print('DWD check skipped:', e)
          " || true
